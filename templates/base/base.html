{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %} <title></title> {% endblock %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
/>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block styles %} {% endblock %}

</head>

<body>

    <nav class="navbar">
        <div class="container">
            {% if config_global %}
            <a href="/" class="logo"> <img src="{{ config_global.logo.url }}" alt="" width="200px"></a>
            {% else %}
            <a href="/" class="logo">
                <span class="logo-icon">?</span> LUIZGUSTAVO.TECH
            </a>
            {% endif %}

            <ul class="nav-links">
                <li><a href="#servicos" data-lang-pt="Serviços" data-lang-en="Services">Serviços</a></li>
                <li><a href="#projetos" data-lang-pt="Projetos" data-lang-en="Projects">Projetos</a></li>
                <li><a href="#contato" data-lang-pt="Contato" data-lang-en="Contact">Contato</a></li>
            </ul>

            <div class="nav-controls">
                <a href="#contato" class="cta-button-nav" data-lang-pt="Fale comigo" data-lang-en="Contact me">
                    Fale comigo <span>→</span>
                </a>
                <button id="theme-toggle" title="Mudar tema">☀️</button>
                <select id="lang-select">
                    <option value="pt">PT</option>
                    <option value="en">EN</option>
                </select>
            </div>
        </div>
    </nav>
    <main id="hero" class="container">
        {% block content %} {% endblock %}
    </main>
    
    <div id="terminal-modal" class="terminal-overlay hidden">
    <div class="terminal-window">
        
        <div class="terminal-header">
            <span>luizgustavo:/contato</span>
            <button id="close-terminal" class="terminal-close">&times;</button>
        </div>
        
        <div id="terminal-body" class="terminal-body">
            <div id="terminal-output">
                </div>
            
            <div class="terminal-prompt-line">
                <span class="terminal-prompt">&gt;</span>
                <input type="text" id="terminal-input" class="terminal-input" autocomplete="off" autofocus>
            </div>
        </div>
    </div>
</div>
<script src="{% static 'js/script.js' %}"></script>
    {% block scripts %} {% endblock %}
</body>

</html>
